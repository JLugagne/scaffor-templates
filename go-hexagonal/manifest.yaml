  # ──────────────────────────────────────────────
  # WIRING — per-entity composition root registration
  # ──────────────────────────────────────────────
  - command: add_wire
    description: Add a wire file that registers entity adapters in the composition root
    variables:
      - key: Context
        description: Bounded context name
      - key: ModulePath
        description: Go module path
      - key: Entity
        description: Entity name in PascalCase
      - key: Adapter
        description: Adapter technology name (e.g. pg)
    files:
      - source: internal/context/wire_entity.go.tmpl
        destination: internal/{{ .Context }}/wire_{{ .Entity | lower }}.go
    hint: |
      Wire file for {{ .Entity }} added to {{ .Context }}.

      Created:
        internal/{{ .Context }}/wire_{{ .Entity | lower }}.go — registers wire{{ .Entity }}() via init()

      How it works:
        wire_{{ .Entity | lower }}.go registers a WireFunc via init(). During Setup(),
        all registered WireFuncs run automatically — no manual edits to init.go needed.
        The wire function creates outbound adapters (repos, publishers), injects them
        into the App via setters, AND registers inbound HTTP/gRPC routes. Handlers receive
        usecase interfaces ({{ .Entity }}Commands, {{ .Entity }}Queries), not *app.App.

      The Set{{ .Entity }}Repo setter and field wiring are handled by add_app_service.

  #──────────────────────────────────────────────
  # INBOUND LAYER — commands, queries, converters
  # ──────────────────────────────────────────────
  - command: add_http_commands
    description: Add HTTP command handlers (write operations) for an entity
    variables:
      - key: Context
        description: Bounded context name
      - key: ModulePath
        description: Go module path
      - key: Entity
        description: Entity name in PascalCase
      - key: EntityHasActions
        description: "true if entity uses action routes (pay, cancel, etc.) instead of PUT/DELETE — suppresses update/delete handler generation"
        default: "false"
    files:
      - source: internal/context/inbound/http/commands/entity.go.tmpl
        destination: internal/{{ .Context }}/inbound/http/commands/{{ .Entity | lower }}.go
    shell_commands:
      # Add {{ .Entity }}App embedding to the package App interface in init.go (idempotent).
      - command: |-
          go-surgeon symbol App --dir internal/{{ .Context }}/inbound/http/commands --body \
            | awk '/^Code \(Empty lines stripped\):$/{flag=1; next} flag' \
            | sed 's/^[0-9]*: //' \
            | awk '/^type App interface {$/,/^}$/' \
            | awk -v m="	{{ .Entity }}App" 'BEGIN{e=0} $0==m{e=1} /^}$/ && e==0 {print m} {print}' \
            | go-surgeon update-interface --file internal/{{ .Context }}/inbound/http/commands/init.go --id App
      # Add Setup{{ .Entity }}(router, svc) call to the SetupRouter function (idempotent).
      - command: |-
          go-surgeon symbol SetupRouter --dir internal/{{ .Context }}/inbound/http/commands --body \
            | awk '/^Code \(Empty lines stripped\):$/{flag=1; next} flag' \
            | sed 's/^[0-9]*: //' \
            | awk '/^func SetupRouter/,/^}$/' \
            | awk -v m="	Setup{{ .Entity }}(router, svc)" 'BEGIN{e=0} $0==m{e=1} /^}$/ && e==0 {print m} {print}' \
            | go-surgeon update-func --file internal/{{ .Context }}/inbound/http/commands/init.go --id SetupRouter
    hint: |
      HTTP command handlers for {{ .Entity }} added (route wiring + 501-stub bodies).

      Created:
        internal/{{ .Context }}/inbound/http/commands/{{ .Entity | lower }}.go
          {{ .Entity }}App interface, {{ .Entity }}Svc, Setup{{ .Entity }}, the action-registrar
          slice, and create/update/delete handlers that currently return 501

      Updated (via go-surgeon):
        internal/{{ .Context }}/inbound/http/commands/init.go — App embeds {{ .Entity }}App;
        SetupRouter calls Setup{{ .Entity }}(router, svc). No edit to wire_{{ .Entity | lower }}.go.

      ── DECIDE THE ROUTES ────────────────────────────────────────────────────────
        • Pure CRUD? keep PUT /{{ .Entity | lower }}s/{id} + DELETE here.
        • State machine (order: place → pay → fulfill)? Drop update/delete and model
          each transition with add_http_action instead — pass EntityHasActions=true
          when scaffolding to suppress the PUT/DELETE routes.
        • Bulk / nested-resource routes? Append them via {{ .Entity | lower }}CommandsActions
          (init() registrar), same mechanism add_http_action uses.

      ── HANDLER PATTERN (fill in create/update/delete) ──────────────────────────

        func (s {{ .Entity }}Svc) create(w http.ResponseWriter, r *http.Request) {
            actor, err := shared.ActorFromRequest(r.Context(), r)
            if err != nil { shared.WriteErrorJSON(w, http.StatusUnauthorized, "UNAUTHORIZED", err.Error()); return }

            var req v1.Create{{ .Entity }}Request
            if err := json.NewDecoder(r.Body).Decode(&req); err != nil {
                shared.WriteErrorJSON(w, http.StatusBadRequest, "INVALID_JSON", err.Error()); return
            }
            if err := s.Validator.Struct(req); err != nil {
                shared.WriteErrorJSON(w, http.StatusBadRequest, "VALIDATION_FAILED", err.Error()); return
            }
            item, err := converters.To{{ .Entity }}Domain(req)
            if err != nil { shared.WriteDomainError(w, err); return }
            created, err := s.App.Create{{ .Entity }}(r.Context(), actor, item)
            if err != nil { shared.WriteDomainError(w, err); return }
            shared.WriteJSON(w, http.StatusCreated, converters.ToPublic{{ .Entity }}(created))
        }

        // update — READ-BEFORE-WRITE (never blind-overwrite: that turns PATCH into a full PUT)
        func (s {{ .Entity }}Svc) update(w http.ResponseWriter, r *http.Request) {
            actor, err := shared.ActorFromRequest(r.Context(), r)
            if err != nil { shared.WriteErrorJSON(w, http.StatusUnauthorized, "UNAUTHORIZED", err.Error()); return }
            var req v1.Update{{ .Entity }}Request
            // decode + validate as above ...
            id := domain.{{ .Entity }}ID(mux.Vars(r)["id"])
            item, err := s.App.Get{{ .Entity }}ByID(r.Context(), actor, id)         // load current state
            if err != nil { shared.WriteDomainError(w, err); return }
            // apply only the fields present in req, via domain SETTERS (not struct writes):
            // if req.Name != nil { if err := item.SetName(*req.Name); err != nil { shared.WriteDomainError(w, err); return } }
            updated, err := s.App.Update{{ .Entity }}(r.Context(), actor, item)
            if err != nil { shared.WriteDomainError(w, err); return }
            shared.WriteJSON(w, http.StatusOK, converters.ToPublic{{ .Entity }}(updated))
        }

        func (s {{ .Entity }}Svc) delete(w http.ResponseWriter, r *http.Request) {
            actor, err := shared.ActorFromRequest(r.Context(), r)
            if err != nil { shared.WriteErrorJSON(w, http.StatusUnauthorized, "UNAUTHORIZED", err.Error()); return }
            id := domain.{{ .Entity }}ID(mux.Vars(r)["id"])
            if err := s.App.Delete{{ .Entity }}(r.Context(), actor, id); err != nil { shared.WriteDomainError(w, err); return }
            w.WriteHeader(http.StatusNoContent)
        }

