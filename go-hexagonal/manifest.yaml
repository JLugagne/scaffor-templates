      For each public method App has for {{ .Entity }}, generate a contract-test stub:
        go-surgeon test -f internal/{{ .Context }}/app/{{ .Entity | lower }}.go -i App.<MethodName>

      Wire each stub to the shared suite — it runs against a real backend
      (testcontainers) and delegates to:
        {{ .Entity | lower }}uctest.{{ .Entity }}CommandsContractTesting(t, svc, actor)
        {{ .Entity | lower }}uctest.{{ .Entity }}QueriesContractTesting(t, svc, actor)
      (the shared cases live in domain/usecases/{{ .Entity | lower }}uc/{{ .Entity | lower }}uctest/contract.go).

