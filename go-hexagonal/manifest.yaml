    hint: |
      App service file for {{ .Entity }} added (near-empty by design — build it from this hint).

      Created:
        internal/{{ .Context }}/app/{{ .Entity | lower }}.go — `package app`, a header doc, ONE commented
          example method, and the Set{{ .Entity }}Repo setter (appended via go-surgeon)

      Auto-wired (via add_wire post_command):
        internal/{{ .Context }}/wire_{{ .Entity | lower }}.go — registers wire{{ .Entity }}() via init()

      REMAINING MANUAL STEPS (in order):
        1. Add the repo field to the App struct in app/config.go:
             {{ .Entity | lower }}Repo {{ .Entity | lower }}repo.{{ .Entity }}Repository
        2. Write the methods (see skeleton below).
        3. Add the compile-time assertions once method names match the interfaces:
             var (
                 _ {{ .Entity | lower }}uc.{{ .Entity }}Commands = (*App)(nil)
                 _ {{ .Entity | lower }}uc.{{ .Entity }}Queries  = (*App)(nil)
             )
        4. For each method you define, generate its unit-test stub:
             go-surgeon test -f internal/{{ .Context }}/app/{{ .Entity | lower }}.go -i App.<MethodName>

      ── DECIDE FIRST ─────────────────────────────────────────────────────────────
        • What operations does {{ .Entity }} actually support? Rename CRUD to the
          ubiquitous language — PlaceOrder/PayOrder/CancelOrder, not Create/Update/Delete.
          (Update the {{ .Entity }}Commands/{{ .Entity }}Queries interface to match, then
          regenerate the mock: add_usecase_mock.)
        • Does an operation touch >1 aggregate, or write-then-publish? → wrap it in
          a.uow.Do(...) so it's atomic. Otherwise call the repo directly.
        • Does it need a domain-service check before mutating? → call services.Xxx
          to validate, then the entity method to mutate, then the repo to persist.

      ── CRUD SKELETON (every method takes `actor *domain.Actor`) ─────────────────

        import (
            "context"
            "fmt"
            "{{ .ModulePath }}/internal/{{ .Context }}/domain"
        )

        func (a *App) Create{{ .Entity }}(ctx context.Context, actor *domain.Actor, item *domain.{{ .Entity }}) (*domain.{{ .Entity }}, error) {
            if err := a.{{ .Entity | lower }}Repo.Create(ctx, actor, item); err != nil {
                return nil, fmt.Errorf("create {{ .Entity | lower }}: %w", err)
            }
            a.logger.InfoContext(ctx, "created {{ .Entity | lower }}", "id", item.ID(), "actor", actor.ID())
            return item, nil
        }

        func (a *App) Get{{ .Entity }}ByID(ctx context.Context, actor *domain.Actor, id domain.{{ .Entity }}ID) (*domain.{{ .Entity }}, error) {
            item, err := a.{{ .Entity | lower }}Repo.FindByID(ctx, actor, id)
            if err != nil {
                return nil, fmt.Errorf("get {{ .Entity | lower }} by id: %w", err)
            }
            return item, nil
        }

        func (a *App) List{{ .Entity }}s(ctx context.Context, actor *domain.Actor, params domain.ListParams) (*domain.ListResult[*domain.{{ .Entity }}], error) {
            res, err := a.{{ .Entity | lower }}Repo.List(ctx, actor, params)
            if err != nil {
                return nil, fmt.Errorf("list {{ .Entity | lower }}s: %w", err)
            }
            return res, nil
        }

        func (a *App) Update{{ .Entity }}(ctx context.Context, actor *domain.Actor, item *domain.{{ .Entity }}) (*domain.{{ .Entity }}, error) {
            if err := a.{{ .Entity | lower }}Repo.Update(ctx, actor, item); err != nil {
                return nil, fmt.Errorf("update {{ .Entity | lower }}: %w", err)
            }
            a.logger.InfoContext(ctx, "updated {{ .Entity | lower }}", "id", item.ID(), "actor", actor.ID())
            return item, nil
        }

        func (a *App) Delete{{ .Entity }}(ctx context.Context, actor *domain.Actor, id domain.{{ .Entity }}ID) error {
            if err := a.{{ .Entity | lower }}Repo.Delete(ctx, actor, id); err != nil {
                return fmt.Errorf("delete {{ .Entity | lower }}: %w", err)
            }
            a.logger.InfoContext(ctx, "deleted {{ .Entity | lower }}", "id", id, "actor", actor.ID())
            return nil
        }

      ── ACTION METHOD EXAMPLE (state transition — preferred over a generic Update) ─

        func (a *App) Pay{{ .Entity }}(ctx context.Context, actor *domain.Actor, id domain.{{ .Entity }}ID) (*domain.{{ .Entity }}, error) {
            item, err := a.{{ .Entity | lower }}Repo.FindByID(ctx, actor, id)         // load
            if err != nil {
                return nil, fmt.Errorf("pay {{ .Entity | lower }}: %w", err)
            }
            if err := item.MarkPaid(); err != nil {                                  // domain method enforces the transition
                return nil, err
            }
            if err := a.{{ .Entity | lower }}Repo.Update(ctx, actor, item); err != nil {
                return nil, fmt.Errorf("pay {{ .Entity | lower }}: %w", err)
            }
            a.logger.InfoContext(ctx, "paid {{ .Entity | lower }}", "id", id, "actor", actor.ID())
            return item, nil
        }

      ── UoW EXAMPLE (atomic across repos) ────────────────────────────────────────

        err := a.uow.Do(ctx, func(ctx context.Context, repos uow.Repositories) error {
            // repos.{{ .Entity }}s().Create(ctx, actor, item)
            // repos.OtherThings().Update(ctx, actor, other)
            return nil
        })

      NEXT STEPS:
        - add_wire         — register this entity in the composition root
                             (this is what actually connects the app to HTTP routes)
        - add_http_handler — expose this entity via HTTP (CRUD routes + converter)
        - add_app_unit_test / add_app_service_contract_test — once the methods exist

